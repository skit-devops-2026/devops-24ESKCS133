services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: kisan-market:local
    container_name: kisan-market-web
    ports:
      - "8080:80"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: kisan-market-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - blackbox-exporter
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: kisan-market-blackbox
    ports:
      - "9115:9115"
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/blackbox.yml"
    restart: unless-stopped
